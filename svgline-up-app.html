<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Svgline-up Pvt Ltd – Site Manager</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#667085;--pri:#0b5cad;--bd:#d9dee5;--ok:#1a8a4a;--bad:#c62f2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mut:#9aa6b2;--pri:#4a9bf0;--bd:#2d3844;--ok:#43c077;--bad:#ef6a6a}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mut:#9aa6b2;--pri:#4a9bf0;--bd:#2d3844;--ok:#43c077;--bad:#ef6a6a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:12px 14px}
header h1{margin:0;font-size:18px}header small{opacity:.85}
.bar{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar button{flex:0 0 auto;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 12px;border-radius:20px;font-size:14px}
.bar button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:900px;margin:0 auto;padding:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:56px}
.full{grid-column:1/-1}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-size:15px;margin-top:10px}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{border-top:1px solid var(--bd);padding:8px 0;display:flex;gap:8px;justify-content:space-between}
.row:first-child{border-top:0}.row b{display:block}.row span{color:var(--mut);font-size:13px;display:block}
.x{background:none;border:0;color:var(--bad);font-size:18px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi div{background:var(--bg);border-radius:8px;padding:10px}.kpi small{color:var(--mut)}.kpi b{font-size:18px;display:block}
.in{color:var(--ok)}.out{color:var(--bad)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
.empty{color:var(--mut);text-align:center;padding:12px}
.drow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--bd);padding:8px 0}.bd{border:1.5px solid;border-radius:8px;min-width:40px;height:40px;background:none;font-size:16px;margin-right:6px;font-weight:600}.bd.ok{color:var(--ok);border-color:var(--ok)}.bd.bad{color:var(--bad);border-color:var(--bad)}.bd.on.ok{background:var(--ok);color:#fff}.bd.on.bad{background:var(--bad);color:#fff}.plus{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--tx);background:none;color:var(--tx);font-size:22px;line-height:1}.wh{background:var(--bg);padding:6px 12px;font-size:12px;font-weight:600;color:var(--mut);margin:0 -12px}.bd.no{color:var(--mut);border-color:var(--mut)}.bd.on.no{background:var(--mut);color:#fff}.sbn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;height:48px;font-size:15px;font-weight:600}.sbn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media print{.bar,form,.x,.noprint{display:none!important}}
</style>
</head>
<body>
<header><h1>Svgline-up Pvt Ltd</h1><small>Pipeline &amp; Civil Work – Daily Site Manager</small></header>
<div class="bar" id="tabs"></div>
<main>
<div class="card noprint"><label>Project filter</label><select id="pf"></select></div>
<div id="view"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>fmt(new Date());
const inr=n=>"₹"+(Number(n)||0).toLocaleString("en-IN");
let editId=null;
let db={projects:[],dpr:[],att:[],fin:[],emp:[],mach:[],mlog:[],diesel:[]},tab="dash",pf="all";
try{const s=localStorage.getItem("svgline_db");if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
db.emp.forEach(e=>{if(e.stype=="Monthly fixed")e.stype="Company Employee"});
const save=()=>{try{localStorage.setItem("svgline_db",JSON.stringify(db))}catch(e){}if(window.cloudSave)window.cloudSave()};
const pname=id=>(db.projects.find(p=>p.id==id)||{}).name||"-";
const ROLES=["Labour","Helper","Mason","Fitter / Welder","Operator","Supervisor","Engineer","Driver"];
const SZ={HDPE:["63","75","90","110","125","140","160","180","200","225","250","280","315","350"],DI:["100","150","200","250","300","350","400","450","500","600"]};
const PR=[["pipe","Pipe type","select",["HDPE","DI"]],["size","Size (mm)","select",SZ.HDPE],["qty","Qty (nos)","number"],["len","Length per pipe (m) – DI = 5.5","number"],["tlen","Total length (m)","calc"],["rate","Rate (₹ per m)","number"],["total","Total (₹)","calc"]];
const MR={att:{h:["date","project"],r:["name","role","status","wage","adv"]},emp:{h:[],r:["name","role","stype","amt"]},mach:{h:[],r:["name","type","own","basis","rate"]}};
const F={
 projects:[["name","Project name","text"],["client","Client","text"],["loc","Location","text"],["start","Start date","date",today()],["budget","Budget (₹)","number"]],
 dpr:[["date","Date","date",today()],["project","Project","project"],["work","Work type","select",["Pipeline laying","Trenching / Excavation","Backfilling","Civil – Foundation","Civil – RCC / Masonry","Road restoration","Testing / Commissioning","Other"]],["loc","Location / Chainage","text"]],
 att:[["date","Date","date",today()],["project","Project","project"],["name","Worker name","text"],["role","Role","select",ROLES],["status","Status","select",["Present","Half Day","Absent"]],["wage","Daily wage (₹)","number"],["adv","Advance given (₹)","number"]],
 emp:[["name","Employee name","text"],["role","Work / Role","select",ROLES],["stype","Salary type","select",["Company Employee","Daily wage"]],["amt","Salary amount (₹) – per month ya per day","number"]],
 mach:[["name","Machine name / No.","text"],["type","Type","select",["JCB","Excavator","Tractor","Dumper / Tipper","Roller","Compressor","Generator","Welding machine","Other"]],["own","Own / Rented","select",["Own","Rented"]],["basis","Rate basis","select",["Per hour","Per day","Per month"]],["rate","Rate (₹)","number"]],
 mlog:[["date","Date","date",today()],["project","Project","project"],["mach","Machine","machine"],["qty","Hours / Days","number"],["fuel","Fuel (₹)","number"],["other","Other expense (₹)","number"],["note","Note","text"]],
 diesel:[["date","Date","date",today()],["type","Type","select",["Company se mila","Apna Purchase","Issue"]],["litres","Litres","number"],["rate","Rate (₹ per litre) – sirf Apna Purchase me","number"],["src","Issue kis stock se (sirf Issue me)","select",["Company diesel","Apna diesel"]],["mach","Machine / Vehicle (Issue me)","machopt"],["project","Project","projopt"],["note","Note (company / challan no. / pump / driver)","text"]],
 fin:[["date","Date","date",today()],["project","Project","project"],["type","Type","select",["Cost","Income"]],["cat","Category","select",["Material","Labour / Wages","Machinery / Rent","Fuel","Transport","Subcontractor","Site expense","Client payment / RA bill","Other"]],["amount","Amount (₹)","number"],["note","Note","text"]]
};
const T={dash:"Dashboard",projects:"Projects",dpr:"Daily DPR",att:"Attendance",emp:"Employees",mlog:"Machine",mach:"Machine List",diesel:"Company Diesel",fin:"Cost & Income"};
function tabs(){$("#tabs").innerHTML=Object.keys(T).map(k=>`<button class="${k==tab?"on":""}" data-t="${k}">${T[k]}</button>`).join("");
 $("#tabs").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;editId=null;render()}}}
function pfSel(){$("#pf").innerHTML='<option value="all">All projects</option>'+db.projects.map(p=>`<option value="${p.id}" ${p.id==pf?"selected":""}>${esc(p.name)}</option>`).join("");$("#pf").onchange=e=>{pf=e.target.value;render()}}
function field(f){const[k,l,t,d]=f;let h=`<div class="${t=="textarea"?"full":""}"><label>${l}</label>`;
 if(t=="select")h+=`<select name="${k}">${d.map(o=>`<option>${o}</option>`).join("")}</select>`;
 else if(t=="machine")h+=`<select name="${k}" required>${db.mach.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select>`;
 else if(t=="projopt")h+=`<select name="${k}"><option value="">—</option>${db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>`;
 else if(t=="machopt")h+=`<select name="${k}"><option value="">—</option>${db.mach.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select>`;
 else if(t=="project")h+=`<select name="${k}" required>${db.projects.map(p=>`<option value="${p.id}" ${p.id==pf?"selected":""}>${esc(p.name)}</option>`).join("")}</select>`;
 else if(t=="calc")h+=`<input name="${k}" type="number" value="0" readonly>`;
 else if(t=="textarea")h+=`<textarea name="${k}"></textarea>`;
 else h+=`<input name="${k}" type="${t}" value="${d||""}" ${k=="name"||k=="amount"?"required":""} ${t=="number"?'step="any" min="0"':""}>`;
 return h+"</div>"}
function formHtml(k){if(k=="mlog"&&!db.mach.length)return'<div class="card empty">Pehle "Machine List" me machine add karein.</div>';if(k!="projects"&&k!="emp"&&k!="mach"&&k!="diesel"&&!db.projects.length)return'<div class="card empty">Pehle "Projects" tab me project add karein.</div>';
 const ed=editId&&db[k]&&db[k].find(x=>x.id==editId);return`<form class="card" id="f"><h2>${ed?"Edit karein":"Nayi entry"} – ${T[k]}</h2><div class="grid">${(MR[k]?F[k].filter(x=>MR[k].h.includes(x[0])):F[k]).map(field).join("")}</div><button class="btn">${ed?"Update karein":"Save karein"}</button>${ed?' <button type="button" class="btn g" id="cx">Cancel</button>':""}</form>`}
function line(k,r){
 if(k=="projects")return[`${esc(r.name)}`,`${esc(r.client)} • ${esc(r.loc)} • Start ${esc(r.start)} • Budget ${inr(r.budget)}`];
 if(k=="diesel"){const m=db.mach.find(x=>x.id==r.mach),kd=dkind(r),t=kd=="C"?"Company se mila":kd=="P"?"Apna diesel aaya":"Diesel diya ("+(dsrc(r)=="C"?"Company":"Apna")+" stock)";return[`${esc(r.date)} – ${t} ${esc(r.litres)} L`,(kd=="P"?`Rate ${inr(r.rate)}/L • <b>${inr(Math.round((+r.litres||0)*(+r.rate||0)))}</b>`:kd=="C"?`${esc(pname(r.project))}`:`${m?esc(m.name):"Other"} • ${esc(pname(r.project))}`)+(r.note?" • "+esc(r.note):"")]}
 if(k=="mach")return[esc(r.name),`${esc(r.type)} • ${esc(r.own)} • ${inr(r.rate)} ${esc(r.basis)}`];
 if(k=="mlog"){const m=db.mach.find(x=>x.id==r.mach)||{};return[`${esc(r.date)} – ${esc(m.name||"-")}`,`${esc(pname(r.project))} • ${esc(r.qty)} ${r.basis=="Per hour"?"hr":"din"} ${r.basis=="Per month"?"(rate "+inr(r.rate)+"/mahina)":"× "+inr(r.rate)} • Fuel ${inr(r.fuel)} • Other ${inr(r.other)}${r.note?" • "+esc(r.note):""}<br><b>Total ${inr(mcost(r))}</b>`]}
 if(k=="emp")return[esc(r.name),`${esc(r.role)} • ${esc(r.stype)} • ${inr(r.amt)}${r.stype=="Daily wage"?" per din":" per mahina"}`];
 if(k=="dpr"){const rs=r.rows||[r],gt=rs.reduce((t,o)=>t+(+o.total||0),0);return[`${esc(r.date)} – ${esc(pname(r.project))} – ${esc(r.work)}`,`${esc(r.loc)}`+rs.map((o,n)=>`<br>${n+1}) ${esc(o.pipe)} ${esc(o.size)} mm | Qty: ${esc(o.qty)} | Length/pipe: ${esc(o.len)} m | Total length: ${esc(o.tlen)} m | Rate: ${inr(o.rate)}/m | <b>${inr(o.total)}</b>`).join("")+`<br><b>Grand total: ${inr(gt)}</b>`]}
 if(k=="att")return[`${esc(r.date)} – ${esc(r.name)} (${esc(r.role)})`,`${esc(pname(r.project))} • ${esc(r.status)} • Wage ${inr(r.wage)} → ${inr(wage(r))}${+r.adv?` • Advance ${inr(r.adv)}`:""}`];
 return[`<span class="${r.type=="Income"?"in":"out"}" style="display:inline">${esc(r.type)} ${inr(r.amount)}</span> – ${esc(r.cat)}`,`${esc(r.date)} • ${esc(pname(r.project))} • ${esc(r.note)}`]}
const DV={Present:1,"Half Day":.5,Absent:0,A:0,"½":.5,P:1,"P+½":1.5,"P+P":2,PA:1,No:0};
const dv=r=>DV[r.status]??0,K=n=>(n||"").trim().toLowerCase(),emp_=n=>db.emp.find(e=>K(e.name)==K(n));
const dimOf=d=>new Date(+d.slice(0,4),+d.slice(5,7),0).getDate();
const rate=r=>{const e=emp_(r.name);return e?(e.stype=="Daily wage"?+e.amt||0:(+e.amt||0)/dimOf(r.date)):+r.wage||0};
const extra=r=>(+r.ot||0)+(+r.bonus||0)+(+r.bata||0)+(+r.other||0);
const wage=r=>dv(r)*rate(r)+extra(r);
const flt=a=>a.filter(r=>pf=="all"||(r.project||r.id)==pf);
function sheet(f){const box=document.createElement("div"),btn=f.querySelector(".btn");
 if(!db.emp.length){box.innerHTML='<div class="empty">Pehle "Employees" tab me employee ke naam ek baar save karein. Phir yahan roz sirf status chunna hai.</div>';f.insertBefore(box,btn);btn.style.display="none";return}
 box.innerHTML='<h2 style="margin-top:12px">Employees ki attendance</h2><button type="button" class="btn g" id="allp" style="margin-top:0">Sab Present</button> <button type="button" class="btn g" id="alla" style="margin-top:0">Sab Absent</button><div id="sh"></div>';
 const sh=box.querySelector("#sh");
 sh.innerHTML=db.emp.map((e,i)=>`<div class="er" data-i="${i}" style="border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:8px"><b>${esc(e.name)}</b> <span style="color:var(--mut);font-size:13px">${esc(e.role)} • ${esc(e.stype)} ${inr(e.amt)}</span><div class="grid" style="margin-top:6px"><div><label>Status</label><select class="st"><option>Present</option><option>Half Day</option><option>Absent</option><option>Skip</option></select></div>${e.stype=="Daily wage"?`<div><label>Daily wage (₹)</label><input class="wg" type="number" step="any" min="0" value="${+e.amt||0}"></div>`:""}<div><label>Advance diya (₹)</label><input class="ad" type="number" step="any" min="0"></div></div></div>`).join("");
 f.insertBefore(box,btn);
 const K=n=>(n||"").trim().toLowerCase();
 const load=()=>{const d=f.elements.date.value,p=f.elements.project.value;sh.querySelectorAll(".er").forEach(div=>{const e=db.emp[div.dataset.i],ex=db.att.find(r=>r.date==d&&r.project==p&&K(r.name)==K(e.name)),st=div.querySelector(".st"),ad=div.querySelector(".ad"),wg=div.querySelector(".wg");
  if(ex){st.value=ex.status=="Advance only"?"Skip":ex.status;ad.value=+ex.adv||"";if(wg&&+ex.wage)wg.value=ex.wage}else{st.value="Present";ad.value=""}})};
 f.elements.date.onchange=load;f.elements.project.onchange=load;load();
 const all=v=>()=>sh.querySelectorAll(".st").forEach(x=>x.value=v);
 box.querySelector("#allp").onclick=all("Present");box.querySelector("#alla").onclick=all("Absent")}
function sheetSave(f){const d=f.elements.date.value,p=f.elements.project.value,K=n=>(n||"").trim().toLowerCase();let n=0;
 f.querySelectorAll(".er").forEach(div=>{const e=db.emp[div.dataset.i],st=div.querySelector(".st").value,ad=+div.querySelector(".ad").value||0,wg=div.querySelector(".wg"),
  status=st=="Skip"?(ad>0?"Advance only":null):st,i=db.att.findIndex(r=>r.date==d&&r.project==p&&K(r.name)==K(e.name));
  if(!status){if(i>=0)db.att.splice(i,1);return}
  const rec={id:i>=0?db.att[i].id:Date.now()+"e"+div.dataset.i,date:d,project:p,name:e.name,role:e.role,status,wage:wg?wg.value:"",adv:ad||""};
  if(i>=0)db.att[i]=rec;else db.att.push(rec);n++});
 save();alert(n+" entry save ho gayi");render()}
let mon=today().slice(0,7);
function mcalc(mm){const m={},cur=today().slice(0,7);
 db.emp.forEach(e=>m[K(e.name)]={name:e.name,work:e.role,p:0,h:0,a:0,w:0,x:0,adv:0,paid:0,md:0,n:0,e});
 flt(db.att).filter(r=>(r.date||"").slice(0,7)==mm).forEach(r=>{const k=K(r.name),o=m[k]||(m[k]={name:r.name,work:r.role,p:0,h:0,a:0,w:0,x:0,adv:0,paid:0,md:0,n:0});o.n++;if(!o.e)o.work=r.role;
  const d=dv(r),rt=rate(r),mk=r.status in DV;if(d>=1)o.p++;else if(d==.5)o.h++;else if(r.status=="Absent"||r.status=="A")o.a++;
  o.w+=wage(r);o.x+=(mk?(d-1)*rt:0)+extra(r);o.adv+=+r.adv||0;o.paid+=+r.paid||0;o.md+=+r.dues||0});
 Object.values(m).forEach(o=>{o.sal=Math.round(o.w)});
 return m}
function mrows(){const m=mcalc(mon),cur=today().slice(0,7),done=mon<cur;
 [...new Set(flt(db.att).map(r=>(r.date||"").slice(0,7)))].filter(x=>x&&x<mon&&x<cur).forEach(mm=>{const q=mcalc(mm);Object.keys(q).forEach(k=>{const o=q[k];if(!m[k])m[k]={name:o.name,work:o.work,p:0,h:0,a:0,adv:0,paid:0,md:0,n:0,sal:0,e:o.e};m[k].carry=(m[k].carry||0)+o.sal-o.adv-o.paid+o.md})});
 return Object.values(m).filter(o=>pf=="all"||o.p+o.h+o.a>0||o.carry).map(o=>{o.carry=o.carry||0;o.dues=o.sal-o.adv-o.paid+o.md;o.rt=o.e?inr(o.e.amt)+(o.e.stype=="Daily wage"?"/din":""):"-";return o}).sort((a,b)=>a.name.localeCompare(b.name))}
function mcard(R,title){const S=k=>R.reduce((t,o)=>t+o[k],0),pc=S("carry")!=0;
 return`<div class="card"><h2>${title}</h2><div class="scroll"><table><tr><th>Name</th><th>Work</th><th>P</th><th>½</th><th>A</th><th>Salary (Monthly)</th><th>Payable (on Attendance)</th><th>Advance</th><th>Paid</th><th>Dues (is mahine)</th>${pc?"<th>Pichla Dues</th>":""}</tr>`+
 R.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.work)}</td><td>${o.p}</td><td>${o.h}</td><td>${o.a}</td><td>${o.rt}</td><td><b>${inr(o.sal)}</b></td><td>${inr(o.adv)}</td><td>${inr(o.paid)}</td><td class="${o.dues>0?"out":"in"}"><b>${inr(o.dues)}</b></td>${pc?`<td class="out">${inr(o.carry)}</td>`:""}</tr>`).join("")+
 `<tr><td><b>Total</b></td><td></td><td></td><td></td><td></td><td></td>${["sal","adv","paid","dues"].concat(pc?["carry"]:[]).map(k=>`<td><b>${inr(S(k))}</b></td>`).join("")}</tr></table></div></div>`}
function renameEmp(a,b){if(a===b)return;db.att.forEach(r=>{if(K(r.name)==K(a))r.name=b})}
let aEdit=false,aEmp=null,aMode="Month",aAnchor=today(),aSheet=null,aField=null;
const ST=["A","½","P","No"],ADD=[["adv","Advance"],["paid","Payment diya"],["dues","Dues"],["other","Other Payment"],["bonus","Bonus"]];
const getA=(n,d)=>db.att.find(r=>K(r.name)==K(n)&&r.date==d);
function upsert(ds,patch){let r=getA(aEmp,ds);const e=emp_(aEmp);if(!r){r={id:Date.now()+"a"+Math.random().toString(36).slice(2,5),date:ds,name:e?e.name:aEmp,role:e?e.role:"",project:"",status:""};db.att.push(r)}if(pf!="all")r.project=pf;Object.assign(r,patch);save()}
function clr(ds){const r=getA(aEmp,ds);if(!r)return;r.status="";if(!ADD.some(x=>r[x[0]]))db.att.splice(db.att.indexOf(r),1);save()}
function attView(){

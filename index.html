*{box-sizing:border-box}

header h1{margin:0;font-size:18px}header small{opacity:.85}
.bar{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar button{flex:0 0 auto;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 12px;border-radius:20px;font-size:14px}
.bar button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:900px;margin:0 auto;padding:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}

textarea{min-height:56px}
.full{grid-column:1/-1}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-size:15px;margin-top:10px}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{border-top:1px solid var(--bd);padding:8px 0;display:flex;gap:8px;justify-content:space-between}
.row:first-child{border-top:0}.row b{display:block}.row span{color:var(--mut);font-size:13px;display:block}
.x{background:none;border:0;color:var(--bad);font-size:18px}

.in{color:var(--ok)}.out{color:var(--bad)}

window.cloudUntrash=async t=>{const r=JSON.parse(t.data);r.id=t.rid;if(!db[t.col].some(x=>x.id==r.id))db[t.col].push(r);local();window.cloudSave();await deleteDoc(doc(fs,"trash",t.k))};
window.cloudBackups=async()=>{const all=await getDocs(collection(fs,"backups"));return[...new Set(all.docs.map(x=>x.data().day))].sort()};
window.cloudRestore=async day=>{const all=await getDocs(collection(fs,"backups")),g={};all.docs.map(x=>x.data()).filter(x=>x.day===day).forEach(x=>{(g[x.col]=g[x.col]||[])[x.i]=x.data});
 const nd={};for(const c of COLS){if(!g[c])throw new Error("Backup adhura hai: "+c);nd[c]=JSON.parse(g[c].join(""))}COLS.forEach(c=>db[c]=nd[c]);local();window.cloudSave()};
function stop(){unsubs.forEach(f=>f());unsubs=[];got={};canWrite=false}
function start(){stop();COLS.forEach(c=>{last[c]={};unsubs.push(onSnapshot(collection(fs,c),snap=>{
 const arr=[],l={};snap.forEach(d=>{const r=d.data();r.id=d.id;arr.push(r);l[d.id]=sj(r);if(c=="diesel"&&r.type=="Company se mila")r.type="Company Diesel";if(r.mode&&window.ACN&&ACN[r.mode])r.mode=ACN[r.mode]});
 const own=snap.metadata.hasPendingWrites;last[c]=l;
 if(!got[c]){got[c]=true;if(arr.length||!db[c].length)db[c]=arr}
 else if(!own)db[c]=arr;
 if(COLS.every(x=>got[x])&&!canWrite){canWrite=true;window.cloudSave();dailyBackup()}
 local();if(own)return;if(typing())dirty=true;else render()},fail))})}

onAuthStateChanged(auth,u=>{if(u){wasIn=true;ov.style.display="none";Q("#lo").style.display="";Q("#lp").value="";start()}else{stop();if(wasIn){COLS.forEach(c=>db[c]=[]);try{localStorage.removeItem("svgline_db")}catch(e){}wasIn=false;render()}ov.style.display="flex";Q("#lo").style.display="none"}});
